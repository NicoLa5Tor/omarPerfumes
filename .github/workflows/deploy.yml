name: Deploy to WordPress (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Validar JavaScript
        run: pnpm run lint:js

      - name: Validar estilos
        run: pnpm run lint:css

      - name: Compilar React (wp-scripts build)
        run: pnpm run build

      - name: Preparar artefacto del plugin
        run: |
          mkdir -p dist/plugin
          cp perfumes-block.php dist/plugin/
          cp -R build dist/plugin/build
          cp -R assets dist/plugin/assets

      - name: Preparar artefacto del tema
        run: |
          mkdir -p dist/theme
          cp -R theme/omar-perfumes/. dist/theme/
          rm -f dist/theme/assets/src.css

      - name: Deploy plugin por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/plugin/
          server-dir: wp-content/plugins/perfumes-block/
          state-name: .ftp-deploy-plugin-state.json

      - name: Deploy tema Omar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/theme/
          server-dir: wp-content/themes/omar-perfumes/
          state-name: .ftp-deploy-theme-state.json

      - name: Verificar artefactos publicados
        run: |
          curl --fail --silent --show-error https://goldenrod-wallaby-542332.hostingersite.com/wp-content/plugins/perfumes-block/build/block.json | grep -q primaryCtaUrl
          curl --fail --silent --show-error https://goldenrod-wallaby-542332.hostingersite.com/wp-content/themes/omar-perfumes/style.css | grep -q "Theme Name: Omar Perfumes"

      - name: Probar storefront publicado
        env:
          STORE_URL: https://goldenrod-wallaby-542332.hostingersite.com/
        run: pnpm run test:smoke
