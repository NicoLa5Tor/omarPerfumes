name: Deploy to WordPress (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy por FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Validar JavaScript
        run: pnpm run lint:js

      - name: Validar estilos
        run: pnpm run lint:css

      - name: Compilar React (wp-scripts build)
        run: pnpm run build

      - name: Preparar artefacto del plugin
        run: |
          mkdir -p dist/plugin
          cp perfumes-block.php dist/plugin/
          cp -R build dist/plugin/build
          cp -R assets dist/plugin/assets

      - name: Preparar artefacto del tema
        run: |
          mkdir -p dist/theme
          cp -R theme/omar-perfumes/. dist/theme/
          rm -f dist/theme/assets/src.css

      # Hostinger drops GitHub runner IPs on :21 at random. Fail fast and retry.
      - name: Deploy plugin por FTP
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 5
          attempt_delay: 20000
          action: SamKirkland/FTP-Deploy-Action@v4.4.0
          with: |
            server: ${{ secrets.FTP_HOST }}
            username: ${{ secrets.FTP_USER }}
            password: ${{ secrets.FTP_PASS }}
            protocol: ftps
            port: 21
            security: loose
            timeout: 30000
            log-level: verbose
            local-dir: ./dist/plugin/
            server-dir: wp-content/plugins/perfumes-block/
            state-name: .ftp-deploy-plugin-state-v2.json

      - name: Deploy tema Omar por FTP
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 5
          attempt_delay: 20000
          action: SamKirkland/FTP-Deploy-Action@v4.4.0
          with: |
            server: ${{ secrets.FTP_HOST }}
            username: ${{ secrets.FTP_USER }}
            password: ${{ secrets.FTP_PASS }}
            protocol: ftps
            port: 21
            security: loose
            timeout: 30000
            log-level: verbose
            local-dir: ./dist/theme/
            server-dir: wp-content/themes/omar-perfumes/
            state-name: .ftp-deploy-theme-state.json

      - name: Verificar artefactos publicados
        run: |
          fetch_with_retry() {
            local url="$1" pattern="$2" label="$3"
            for attempt in 1 2 3 4 5; do
              body="$(curl --fail --silent --show-error \
                --retry 2 --retry-delay 2 \
                --connect-timeout 15 --max-time 30 \
                -A "Mozilla/5.0 (compatible; OmarDeployCheck/1.0)" \
                "$url" 2>/dev/null)" || true
              if printf '%s' "$body" | grep -q "$pattern"; then
                echo "OK: $label verificado (intento $attempt)"
                return 0
              fi
              echo "Intento $attempt fallido para $label, reintentando..."
              sleep $(( attempt * 3 ))
            done
            echo "Error: $label no verificado tras 5 intentos." >&2
            return 1
          }
          fetch_with_retry \
            "https://goldenrod-wallaby-542332.hostingersite.com/wp-content/plugins/perfumes-block/build/block.json" \
            "primaryCtaUrl" \
            "build/block.json"
          fetch_with_retry \
            "https://goldenrod-wallaby-542332.hostingersite.com/wp-content/themes/omar-perfumes/style.css" \
            "Theme Name: Omar Perfumes" \
            "theme/style.css"

      - name: Probar storefront publicado
        env:
          STORE_URL: https://goldenrod-wallaby-542332.hostingersite.com/
        run: pnpm run test:smoke
