name: Deploy to WordPress (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar React (wp-scripts build)
        run: pnpm run build

      - name: Deploy por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /wp-content/plugins/perfumes-block/
          exclude: |
            **/node_modules/**
            **/src/**
            **/.git/**
            **/.github/**
            **/build/**/*.map
            package.json
            pnpm-lock.yaml
            .gitignore
            README.md